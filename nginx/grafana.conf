limit_req_zone $binary_remote_addr zone=grafana_zone:10m rate=50r/s;

server {
    listen 443 ssl;
    server_name grafana.boris-guard.space;

    ssl_certificate /etc/letsencrypt/live/grafana.boris-guard.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.boris-guard.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;

    # Общая с другими проектами зона (объявлена в базовом nginx.conf edge-nginx) —
    # страхует от большого числа параллельных соединений с одного IP.
    limit_conn conn_limit_per_ip 20;

    location /prometheus/ {
        limit_req zone=grafana_zone burst=20 nodelay;
        rewrite ^/prometheus(/.*)$ $1 break;
        set $prometheus_upstream http://prometheus:9090;
        # $uri (не $request_uri!) — чтобы учитывался rewrite выше: с переменной в
        # proxy_pass nginx не срезает префикс location сам, путь нужно строить явно.
        proxy_pass $prometheus_upstream$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /loki/ {
        limit_req zone=grafana_zone burst=20 nodelay;
        auth_basic "Loki push";
        auth_basic_user_file /etc/nginx/conf.d/loki.htpasswd;
        client_max_body_size 10m;

        set $loki_upstream http://loki:3100;
        # $request_uri без среза — путь Loki API и так живёт под /loki/ (например
        # /loki/api/v1/push), совпадает 1-в-1 с тем, что шлёт клиент (Alloy).
        proxy_pass $loki_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /grafana {
        return 301 $scheme://$host/grafana/;
    }

    location /grafana/ {
        limit_req zone=grafana_zone burst=20 nodelay;
        set $grafana_upstream http://grafana:3000;
        # $request_uri — полный путь как прислал клиент (включая /grafana/), без среза
        # префикса: Grafana с GF_SERVER_SERVE_FROM_SUB_PATH=true сама ожидает его в пути.
        proxy_pass $grafana_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        sub_filter '__grafanaRoot__/public/' '/grafana/public/';
        sub_filter '__grafanaRoot__' '/grafana';
        sub_filter_once off;
    }
}
