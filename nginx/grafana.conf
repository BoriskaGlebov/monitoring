limit_req_zone $binary_remote_addr zone=grafana_zone:10m rate=50r/s;

server {
    listen 443 ssl;
    server_name grafana.boris-guard.space;

    ssl_certificate /etc/letsencrypt/live/grafana.boris-guard.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.boris-guard.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;

    # Общая с другими проектами зона (объявлена в базовом nginx.conf edge-nginx) —
    # страхует от большого числа параллельных соединений с одного IP.
    limit_conn conn_limit_per_ip 20;

    location /prometheus/ {
        limit_req zone=grafana_zone burst=20 nodelay;
        set $prometheus_upstream http://prometheus:9090;
        proxy_pass $prometheus_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/prometheus(/.*)$ $1 break;
    }

    location = /grafana {
        return 301 $scheme://$host/grafana/;
    }

    location /grafana/ {
        limit_req zone=grafana_zone burst=20 nodelay;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        sub_filter '__grafanaRoot__/public/' '/grafana/public/';
        sub_filter '__grafanaRoot__' '/grafana';
        sub_filter_once off;
    }
}
