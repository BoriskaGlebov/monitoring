apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram-main
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: $TELEGRAM_CHAT_ID
          message: |
            {{ range .Alerts }}
            {{ if eq .Status "firing" }}🔴 ПРОБЛЕМА{{ else }}✅ РЕШЕНО{{ end }} — {{ .Labels.alertname }}
            Сервер: {{ .Labels.instance }}
            {{ .Annotations.summary }}
            {{ if eq .Status "firing" }}С {{ .StartsAt.Format "02.01 15:04" }}{{ else }}Длилось до {{ .EndsAt.Format "02.01 15:04" }}{{ end }}
            {{ end }}
        disableResolveMessage: false
