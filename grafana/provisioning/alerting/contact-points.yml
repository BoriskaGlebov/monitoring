apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram-main
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: $TELEGRAM_CHAT_ID
          parse_mode: HTML
          message: |
            {{ range .Alerts }}
            {{ if eq .Status "firing" }}🔴 <b>ПРОБЛЕМА</b>{{ else }}✅ <b>РЕШЕНО</b>{{ end }} — {{ .Labels.alertname }}
            {{ if .Labels.instance }}Сервер: {{ .Labels.instance }}
            {{ end }}{{ .Annotations.summary }}
            {{ if eq .Status "firing" }}С {{ .StartsAt.Format "02.01 15:04" }}{{ else }}Длилось до {{ .EndsAt.Format "02.01 15:04" }}{{ end }}
            <a href="{{ .GeneratorURL }}">Открыть в Grafana</a>{{ if eq .Status "firing" }} | <a href="{{ .SilenceURL }}">Заглушить</a>{{ end }}{{ if .Annotations.logs_link }} | <a href="{{ .Annotations.logs_link }}">Смотреть логи</a>{{ end }}
            {{ end }}
        disableResolveMessage: false
