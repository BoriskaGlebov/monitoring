apiVersion: 1

# Файловый провижининг алертов сам не удаляет правила, пропавшие из groups —
# нужно явно перечислить старые uid на удаление.
deleteRules:
  - orgId: 1
    uid: cpu-overload-vpn-boriska
  - orgId: 1
    uid: cpu-overload-others

groups:
  - orgId: 1
    name: infra-alerts
    folder: Infra Alerts
    interval: 1m
    rules:

      - uid: exporter-down
        title: "Экспортёр недоступен"
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} на {{ $labels.instance }} не отвечает уже 2+ минуты"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: "up == 0"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: B

      - uid: disk-almost-full
        title: "Диск почти заполнен"
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Диск на {{ $labels.instance }} занят более чем на 90%"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                max by (instance) (
                  (node_filesystem_size_bytes{fstype=~"xfs|ext4"} - node_filesystem_free_bytes{fstype=~"xfs|ext4"})
                  / node_filesystem_size_bytes{fstype=~"xfs|ext4"}
                )
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.9] }
              refId: B

      - uid: memory-high
        title: "Память заполнена"
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "Занято более 90% RAM на {{ $labels.instance }}"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
              refId: B

      - uid: swap-high
        title: "Swap сильно используется"
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "Занято более 50% swap на {{ $labels.instance }} — вероятна нехватка RAM"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes * 100
                and node_memory_SwapTotal_bytes > 0
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [50] }
              refId: B

      - uid: cpu-overload
        title: "CPU перегружен"
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "Load average на {{ $labels.instance }} превышает число ядер уже 10+ минут"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                node_load1 / on(instance) group_left() count by (instance) (count by (instance, cpu) (node_cpu_seconds_total))
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }
              refId: B

      - uid: containers-dropped
        title: "Стало меньше контейнеров"
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Число запущенных контейнеров на {{ $labels.instance }} упало по сравнению с часом назад"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                count by (instance) (container_last_seen) < count by (instance) (container_last_seen offset 1h) - 1
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1] }
              refId: B

      - uid: traffic-in-drop
        title: "Входящий трафик резко упал"
        condition: B
        for: 3m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Входящий трафик на {{ $labels.instance }}: сейчас {{ printf \"%.2f\" $values.C.Value }} Мбит/с, сутки назад в это же время {{ printf \"%.2f\" $values.D.Value }} Мбит/с (осталось {{ humanizePercentage $values.A.Value }}) — возможна блокировка (РКН), нужна срочная проверка доступности"
        data:
          # Отношение текущего трафика (5m) к среднему за час сутки назад.
          # Только для хостов, где сутки назад было > 1 Мбит/с (125000 байт/с), чтобы не шуметь на ночном/фоновом трафике.
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                (
                  sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[5m]))
                  /
                  sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 1d))
                )
                and on (instance)
                sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 1d)) > 125000
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.3] }
              refId: B
          # C и D — только для текста уведомления, в Мбит/с
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[5m])) * 8 / 1e6
              instant: true
              refId: C
          - refId: D
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 1d)) * 8 / 1e6
              instant: true
              refId: D

      - uid: traffic-out-drop
        title: "Исходящий трафик резко упал"
        condition: B
        for: 3m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Исходящий трафик на {{ $labels.instance }}: сейчас {{ printf \"%.2f\" $values.C.Value }} Мбит/с, сутки назад в это же время {{ printf \"%.2f\" $values.D.Value }} Мбит/с (осталось {{ humanizePercentage $values.A.Value }}) — возможна блокировка (РКН), нужна срочная проверка доступности"
        data:
          # Отношение текущего трафика (5m) к среднему за час сутки назад.
          # Только для хостов, где сутки назад было > 1 Мбит/с (125000 байт/с), чтобы не шуметь на ночном/фоновом трафике.
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                (
                  sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[5m]))
                  /
                  sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 1d))
                )
                and on (instance)
                sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 1d)) > 125000
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.3] }
              refId: B
          # C и D — только для текста уведомления, в Мбит/с
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[5m])) * 8 / 1e6
              instant: true
              refId: C
          - refId: D
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 1d)) * 8 / 1e6
              instant: true
              refId: D

      - uid: app-error-spike
        title: "Много ошибок в логах (api/vpn_bot)"
        condition: B
        for: 0m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "В контейнере {{ $labels.container }} за 5 минут {{ $values.A }} строк с ERROR"
          logs_link: "https://grafana.boris-guard.space/grafana/d/container-logs/logs?var-container={{ $labels.container }}&from=now-15m&to=now"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: >
                sum by (container) (count_over_time({container=~"api|vpn_bot"} |~ "(?i)error" [5m]))
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [10] }
              refId: B
