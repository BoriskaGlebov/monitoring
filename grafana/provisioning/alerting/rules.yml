apiVersion: 1

# Файловый провижининг алертов сам не удаляет правила, пропавшие из groups —
# нужно явно перечислить старые uid на удаление.
deleteRules:
  - orgId: 1
    uid: cpu-overload-vpn-boriska
  - orgId: 1
    uid: cpu-overload-others
  - orgId: 1
    uid: traffic-in-drop
  - orgId: 1
    uid: traffic-out-drop

groups:
  - orgId: 1
    name: infra-alerts
    folder: Infra Alerts
    interval: 1m
    rules:

      - uid: exporter-down
        title: "Экспортёр недоступен"
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} на {{ $labels.instance }} не отвечает уже 2+ минуты"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: "up == 0"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: B

      - uid: disk-almost-full
        title: "Диск почти заполнен"
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Диск на {{ $labels.instance }} занят более чем на 90%"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                max by (instance) (
                  (node_filesystem_size_bytes{fstype=~"xfs|ext4"} - node_filesystem_free_bytes{fstype=~"xfs|ext4"})
                  / node_filesystem_size_bytes{fstype=~"xfs|ext4"}
                )
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.9] }
              refId: B

      - uid: memory-high
        title: "Память заполнена"
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "Занято более 90% RAM на {{ $labels.instance }}"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
              refId: B

      - uid: swap-high
        title: "Swap сильно используется"
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "Занято более 50% swap на {{ $labels.instance }} — вероятна нехватка RAM"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes * 100
                and node_memory_SwapTotal_bytes > 0
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [50] }
              refId: B

      - uid: cpu-overload
        title: "CPU перегружен"
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "Load average на {{ $labels.instance }} превышает число ядер уже 10+ минут"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                node_load1 / on(instance) group_left() count by (instance) (count by (instance, cpu) (node_cpu_seconds_total))
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }
              refId: B

      - uid: containers-dropped
        title: "Стало меньше контейнеров"
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Число запущенных контейнеров на {{ $labels.instance }} упало по сравнению с часом назад"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                count by (instance) (container_last_seen) < count by (instance) (container_last_seen offset 1h) - 1
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1] }
              refId: B

      - uid: traffic-drop
        title: "Трафик резко упал"
        condition: T
        for: 3m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Трафик на {{ $labels.instance }}: входящий сейчас {{ printf \"%.2f\" $values.CI.Value }} Мбит/с (норма {{ printf \"%.2f\" $values.DI.Value }} Мбит/с, осталось {{ humanizePercentage $values.RI.Value }}), исходящий сейчас {{ printf \"%.2f\" $values.CO.Value }} Мбит/с (норма {{ printf \"%.2f\" $values.DO.Value }} Мбит/с, осталось {{ humanizePercentage $values.RO.Value }}) — возможна блокировка (РКН), нужна срочная проверка доступности"
        data:
          # RI/RO — отношение текущего трафика (5m) к среднему за тот же час за последние 3 дня
          # (вместо одной точки "сутки назад" — устойчивее к разовым скачкам трафика).
          - refId: RI
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[5m]))
                /
                (
                  (
                    sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 1d))
                    +
                    sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 2d))
                    +
                    sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 3d))
                  ) / 3
                )
              instant: true
              refId: RI
          # FI/FO — базовая линия (3-дневное среднее) в байт/с, нужна только для порога "> 1 Мбит/с",
          # чтобы не шуметь на ночном/фоновом трафике.
          - refId: FI
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                (
                  sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 1d))
                  +
                  sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 2d))
                  +
                  sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 3d))
                ) / 3
              instant: true
              refId: FI
          - refId: RO
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[5m]))
                /
                (
                  (
                    sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 1d))
                    +
                    sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 2d))
                    +
                    sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 3d))
                  ) / 3
                )
              instant: true
              refId: RO
          - refId: FO
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                (
                  sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 1d))
                  +
                  sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 2d))
                  +
                  sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 3d))
                ) / 3
              instant: true
              refId: FO
          # CI/CO и DI/DO — только для текста уведомления, в Мбит/с
          - refId: CI
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[5m])) * 8 / 1e6
              instant: true
              refId: CI
          - refId: DI
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                (
                  (
                    sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 1d))
                    +
                    sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 2d))
                    +
                    sum by (instance) (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 3d))
                  ) / 3
                ) * 8 / 1e6
              instant: true
              refId: DI
          - refId: CO
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[5m])) * 8 / 1e6
              instant: true
              refId: CO
          - refId: DO
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >
                (
                  (
                    sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 1d))
                    +
                    sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 2d))
                    +
                    sum by (instance) (rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[1h] offset 3d))
                  ) / 3
                ) * 8 / 1e6
              instant: true
              refId: DO
          # M — срабатывает, если упал вход ИЛИ выход (каждый — только если его трёхдневная база > 1 Мбит/с)
          - refId: M
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: math
              expression: "($RI < 0.2 && $FI > 125000) || ($RO < 0.2 && $FO > 125000)"
              refId: M
          - refId: T
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: M
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: T

      - uid: app-error-spike
        title: "Много ошибок в логах (api/vpn_bot)"
        condition: B
        for: 0m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "В контейнере {{ $labels.container }} за 5 минут {{ $values.A.Value }} строк с ERROR"
          logs_link: "https://grafana.boris-guard.space/grafana/d/container-logs/logs?var-container={{ $labels.container }}&from=now-15m&to=now"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: >
                sum by (container) (count_over_time({container=~"api|vpn_bot"} |~ "(?i)error" [5m]))
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [10] }
              refId: B
