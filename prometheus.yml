global:
  scrape_interval: 15s

# Лейбл group (prod/dev) — единственное место, где назначается "боевой" хост это или
# резервный/девелоперский. Алерты, которым это важно (например traffic-drop),
# фильтруются по {group="prod"} — чтобы переключить хост между прод и дев, достаточно
# просто переставить его target между соответствующими блоками ниже, PromQL в
# правилах трогать не нужно.
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]
        labels:
          instance: 'vps04.boris-guard.pro:9090'
          group: 'prod'
  - job_name: 'cadvisor'
    static_configs:
      - targets: [ 'cadvisor:8080' ]
        labels:
          instance: 'vps04.boris-guard.pro:8080'
          group: 'prod'
      - targets: [ 'vps02.boris-guard.pro:8080', 'vps03.boris-guard.pro:8080', 'vps05.boris-guard.pro:8080' ]
        labels:
          group: 'prod'
      - targets: [ 'vps06.boris-guard.pro:8080', 'vps01.boris-guard.pro:8080','vps07.boris-guard.pro:8080', 'vps08.boris-guard.pro:8080' ]
        labels:
          group: 'dev'
  - job_name: 'node-exporter'
    static_configs:
      - targets: [ 'node-exporter:9100' ]
        labels:
          instance: 'vps04.boris-guard.pro:9100'
          group: 'prod'
      - targets: [ 'vps02.boris-guard.pro:9100', 'vps03.boris-guard.pro:9100', 'vps05.boris-guard.pro:9100' ]
        labels:
          group: 'prod'
      - targets: [ 'vps06.boris-guard.pro:9100', 'vps01.boris-guard.pro:9100', 'vps07.boris-guard.pro:9100', 'vps08.boris-guard.pro:9100' ]
        labels:
          group: 'dev'
