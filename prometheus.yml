global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]
        labels:
          instance: 'boris-guard.space:9090'
  - job_name: 'cadvisor'
    static_configs:
      - targets: [ 'cadvisor:8080' ]
        labels:
          instance: 'boris-guard.space:8080'
      - targets: [ 'help-blocks.ru:8080', 'x-ray-boriska.pro:8080', 'vpn-boriska.ru:8080', 'amn-boris.ru:8080' ]
  - job_name: 'node-exporter'
    static_configs:
      - targets: [ 'node-exporter:9100' ]
        labels:
          instance: 'boris-guard.space:9100'
      - targets: [ 'help-blocks.ru:9100', 'x-ray-boriska.pro:9100', 'vpn-boriska.ru:9100', 'amn-boris.ru:9100' ]
