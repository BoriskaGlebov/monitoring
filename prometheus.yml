global:
  scrape_interval: 15s

# Лейбл group (prod/dev) — единственное место, где назначается "боевой" хост это или
# резервный/девелоперский. Алерты, которым это важно (например traffic-drop),
# фильтруются по {group="prod"} — чтобы переключить хост между прод и дев, достаточно
# просто переставить его target между соответствующими блоками ниже, PromQL в
# правилах трогать не нужно.
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]
        labels:
          instance: 'boris-guard.space:9090'
          group: 'prod'
  - job_name: 'cadvisor'
    static_configs:
      - targets: [ 'cadvisor:8080' ]
        labels:
          instance: 'boris-guard.space:8080'
          group: 'prod'
      - targets: [ 'help-blocks.ru:8080', 'x-ray-boriska.pro:8080' ]
        labels:
          group: 'prod'
      - targets: [ 'vpn-boriska.ru:8080', 'amn-boris.ru:8080', 'boris-guard.pro:8080' ]
        labels:
          group: 'dev'
  - job_name: 'node-exporter'
    static_configs:
      - targets: [ 'node-exporter:9100' ]
        labels:
          instance: 'boris-guard.space:9100'
          group: 'prod'
      - targets: [ 'help-blocks.ru:9100', 'x-ray-boriska.pro:9100' ]
        labels:
          group: 'prod'
      - targets: [ 'vpn-boriska.ru:9100', 'amn-boris.ru:9100', 'boris-guard.pro:9100' ]
        labels:
          group: 'dev'
