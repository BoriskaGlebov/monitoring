  develop_vpn_boriska:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'  # Выполняется только для ветки develop.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Клонирование репозитория

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.5.3  # Настройка SSH-ключа
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}  # Приватный ключ из секретов

      - name: Add known hosts
        run: echo "${{ secrets.SERVER_IP }} $(ssh-keyscan -H ${{ secrets.SERVER_IP }})" >> ~/.ssh/known_hosts  # Добавление сервера в known_hosts
      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "whoami" && echo PRIVET # Проверка подключения

      - name: Deploy to server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          cd production/monitoring || exit  # Переход в директорию приложения
          git restore .
          git checkout develop
          git pull origin develop            # Обновление кода из репозитория

          rm -f .env
          echo "GF_ADMIN_USER=${{ secrets.GF_ADMIN_USER }}" >> .env
          echo "GF_ADMIN_PASSWORD=${{ secrets.GF_ADMIN_PASSWORD }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "NODE_HOSTNAME=vpn-boriska.ru" >> .env
          echo "CADVISOR_BIND=127.0.0.1" >> .env
          echo "NODE_EXPORTER_BIND=127.0.0.1" >> .env

          docker compose -f docker-compose.yaml -f docker-compose.monitoring-server.yml -f docker-compose.monitoring-agent.yml down
          docker compose -f docker-compose.yaml -f docker-compose.monitoring-server.yml -f docker-compose.monitoring-agent.yml up -d --build
          EOF